<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KRLCC Laity Conclave 26 - Poster Generator</title>
<meta name="description" content="Create your personalised KRLCC Laity Conclave 26 participation poster.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&family=Noto+Sans+Malayalam:wght@700;800&display=swap');

:root{
  --red:#e21b23;--red-dark:#bd1118;--yellow:#ffca05;
  --ink:#171717;--muted:#676767;--line:#e5e5e5;
  --card:#fff;--bg:#f8f8f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 8% 12%,rgba(255,202,5,.18),transparent 20%),
    radial-gradient(circle at 96% 74%,rgba(226,27,35,.11),transparent 24%),
    var(--bg);
  padding:18px;
}
.app{width:100%;max-width:1040px;margin:0 auto}

.brand-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo{width:56px;height:56px;object-fit:contain}
.eyebrow{margin:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
h1{margin:2px 0 4px;text-align:center;font-family:Anton,Impact,sans-serif;font-weight:400;
   font-size:clamp(28px,6vw,44px);letter-spacing:.01em;text-transform:uppercase}
.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:22px;align-items:start}
@media(max-width:820px){
  .grid{grid-template-columns:1fr;gap:14px}
  canvas#poster{max-height:56vh}
}
@media(max-width:560px){
  body{padding:11px}
  .card{padding:14px;border-radius:14px}
  .logo{width:46px;height:46px}
  .sub{margin-bottom:16px;font-size:13px}
  .brand-top{margin-bottom:4px}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
      box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}

.preview-wrap{position:relative;display:flex;justify-content:center}
canvas#poster{width:auto;height:auto;max-width:100%;max-height:72vh;border-radius:10px;display:block;
  background:#eee;box-shadow:0 6px 22px rgba(0,0,0,.14);touch-action:pan-y;cursor:grab}
canvas#poster.has-photo{touch-action:none}
@media(min-width:821px){canvas#poster{max-width:420px}}
canvas#poster.dragging{cursor:grabbing}
.hint{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted)}

label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--muted);margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text]{width:100%;padding:12px 14px;font:600 16px Inter,Arial,sans-serif;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(226,27,35,.12)}

.filebtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed #cfcfcf;
  border-radius:10px;cursor:pointer;background:#fcfcfc}
.filebtn:hover{border-color:var(--red);background:#fffafa}
.filebtn span{font-size:13px;color:var(--muted)}
.filebtn strong{font-size:13px;color:var(--ink)}
input[type=file]{display:none}

.zoomrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.zoomrow span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
input[type=range]{flex:1;accent-color:var(--red)}

.btn{display:block;width:100%;padding:14px 18px;border:0;border-radius:11px;cursor:pointer;
  font:800 14px Inter,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark)}
.btn-primary:disabled{background:#ddd;color:#999;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.btn-ghost:hover{border-color:var(--ink)}

.notice{margin:16px 0 0;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;
  overflow-wrap:anywhere;
  background:#fff6f6;border:1px solid #f3c9cb;color:#8a1f24}
.notice code{background:#fff;padding:1px 5px;border-radius:4px;font-size:12px}
.notice[hidden]{display:none}
.status{margin:12px 0 0;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.status.ok{color:#2c7a35}
.status.err{color:var(--red)}
.status[hidden]{display:none}
footer{margin:26px 0 8px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">

  <div class="brand-top"><img class="logo" src="../imgs/kcym_logo.png" alt="KCYM Latin"></div>
  <p class="eyebrow">KCYM Latin State Committee</p>
  <h1>Laity Conclave 26</h1>
  <p class="sub">Add your name and designation, then download your participation poster.</p>

  <div class="grid">

    <div class="card">
      <div class="preview-wrap"><canvas id="poster" width="843" height="1264"></canvas></div>
      <p class="hint" id="hint">Drag the photo to reposition it.</p>
    </div>

    <div class="card">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="34" placeholder="e.g. Sherin K R" autocomplete="name">
      </div>

      <div class="field">
        <label for="designation">Your designation</label>
        <input type="text" id="designation" maxlength="42" placeholder="e.g. State Secretary">
      </div>

      <div class="field">
        <label>Your photo</label>
        <label class="filebtn" for="photo">
          <strong id="photoname">Choose photo</strong>
          <span>JPG or PNG</span>
        </label>
        <input type="file" id="photo" accept="image/*">
        <div class="zoomrow">
          <span>Zoom</span>
          <input type="range" id="zoom" min="100" max="300" value="100">
        </div>
      </div>

      <button class="btn btn-primary" id="download" disabled>Download poster</button>
      <button class="btn btn-ghost" id="share" hidden>Share</button>

      <p class="status" id="status" hidden></p>
      <div class="notice" id="notice" hidden></div>
    </div>

  </div>

  <footer>KCYM Latin State Committee &middot; Sunday 4th October &middot; Leo XIII HSS Campus, Alappuzha</footer>
</div>

<script>
/* ---------------------------------------------------------------
   Geometry measured from the 843x1264 artwork, in artwork pixels.
   Everything is scaled by S, so a higher-resolution re-export of
   the same design still lines up. Open the page with ?guides=1 to
   see these boxes drawn over the poster.
----------------------------------------------------------------*/
const BASE = {w:1024, h:1536};

const LAYOUT = {
  photo: {x:302, y:371, w:422, h:412},
  name: {
    cover: {x:298, y:798, w:430, h:58},
    cx:513, cy:827, size:64, maxW:490, color:'#1b1b1b'
  },
  desig: {
    cover: {x:295, y:884, w:428, h:45},
    cx:509, cy:904, size:50, maxW:460, color:'#ffffff'
  }
};

// Apps Script web app that files each poster in the shared Drive folder.
// See upload.gs. Leave empty to turn the copy off - the page still works.
const UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbx4tnAUctQUz2GMk0byal4C6UYVTriANz8-PVX3rl5omPwExNLLfpbKPqdMT8nFKXMR/exec';

const TEMPLATES = ['template.png','template.jpg','template.jpeg','template.webp'];
const FONT_STACK = '800 %SIZEpx Montserrat, "Noto Sans Malayalam", Arial, sans-serif';

const canvas = document.getElementById('poster');
const ctx    = canvas.getContext('2d', {willReadFrequently:true});
const guides = new URLSearchParams(location.search).has('guides');

const els = {
  name: document.getElementById('name'),
  desig: document.getElementById('designation'),
  photo: document.getElementById('photo'),
  photoName: document.getElementById('photoname'),
  zoom: document.getElementById('zoom'),
  download: document.getElementById('download'),
  share: document.getElementById('share'),
  notice: document.getElementById('notice'),
  status: document.getElementById('status')
};

let template = null;
let userPhoto = null;
let S = 1;
const view = {scale:1, ox:0, oy:0};

/* ----------------------------- loading ----------------------------- */

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function loadScript(src){
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.onload = resolve;
    el.onerror = reject;
    el.src = src;
    document.head.appendChild(el);
  });
}

// True when the image can be drawn and read back. A file:// page gives every
// local file its own opaque origin, which taints the canvas and blocks export.
function exportable(img){
  const probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  const c = probe.getContext('2d');
  c.drawImage(img, 0, 0, 1, 1);
  try { c.getImageData(0, 0, 1, 1); return true; }
  catch(e){ return false; }
}

async function loadTemplate(){
  for (const src of TEMPLATES){
    let img;
    try { img = await loadImage(src); } catch(e){ continue; }
    if (exportable(img)) return img;
    break;  // the file is there but this origin taints it - use the embedded copy
  }
  // Only fetched when needed, so visitors over http never download the base64.
  try { await loadScript('template.js'); } catch(e){ return null; }
  if (typeof TEMPLATE_DATA_URL === 'string'){
    try { return await loadImage(TEMPLATE_DATA_URL); } catch(e){ /* fall through */ }
  }
  return null;
}

function showNotice(html){
  els.notice.hidden = false;
  els.notice.innerHTML = html;
}

/* ------------------------- drawing helpers ------------------------- */

function rectOf(box){
  return {
    x: Math.round(box.x * S),
    y: Math.round(box.y * S),
    w: Math.round(box.w * S),
    h: Math.round(box.h * S)
  };
}

// Removes the placeholder wording printed inside a brush stroke. Each row is
// refilled by blending the stroke's own colour from just left of the text to
// just right of it, so the paint's vertical gradient and the ragged edges of
// the stroke are left untouched.
function coverText(spec){
  const r = rectOf(spec.cover);
  const pad = Math.max(2, Math.round(8 * S));
  const lx = Math.max(0, r.x - pad);
  const rx = Math.min(canvas.width - 1, r.x + r.w + pad);

  const left  = ctx.getImageData(lx, r.y, 1, r.h).data;
  const right = ctx.getImageData(rx, r.y, 1, r.h).data;
  const out   = ctx.createImageData(r.w, r.h);
  const d     = out.data;

  for (let row = 0; row < r.h; row++){
    const o = row * 4;
    for (let col = 0; col < r.w; col++){
      const t = r.w > 1 ? col / (r.w - 1) : 0;
      const i = (row * r.w + col) * 4;
      d[i]     = left[o]     + (right[o]     - left[o])     * t;
      d[i + 1] = left[o + 1] + (right[o + 1] - left[o + 1]) * t;
      d[i + 2] = left[o + 2] + (right[o + 2] - left[o + 2]) * t;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(out, r.x, r.y);
}

function drawText(text, spec){
  if (!text) return;
  const maxW = spec.maxW * S;
  let size = spec.size * S;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = spec.color;

  const apply = s => {
    ctx.font = FONT_STACK.replace('%SIZE', Math.round(s));
    if ('letterSpacing' in ctx) ctx.letterSpacing = (s * 0.015).toFixed(2) + 'px';
  };

  apply(size);
  while (ctx.measureText(text).width > maxW && size > 8){
    size -= 1;
    apply(size);
  }
  ctx.fillText(text, spec.cx * S, spec.cy * S);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function clampView(){
  const r = rectOf(LAYOUT.photo);
  const base = Math.max(r.w / userPhoto.width, r.h / userPhoto.height);
  const s = base * view.scale;
  const slackX = Math.max(0, (userPhoto.width  * s - r.w) / 2) / r.w;
  const slackY = Math.max(0, (userPhoto.height * s - r.h) / 2) / r.h;
  view.ox = Math.max(-slackX, Math.min(slackX, view.ox));
  view.oy = Math.max(-slackY, Math.min(slackY, view.oy));
}

function drawPhoto(){
  const r = rectOf(LAYOUT.photo);
  clampView();
  const base = Math.max(r.w / userPhoto.width, r.h / userPhoto.height);
  const s = base * view.scale;
  const dw = userPhoto.width * s, dh = userPhoto.height * s;

  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();
  ctx.drawImage(userPhoto,
    r.x + (r.w - dw) / 2 + view.ox * r.w,
    r.y + (r.h - dh) / 2 + view.oy * r.h,
    dw, dh);
  ctx.restore();
}

function drawGuides(){
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#0066ff';
  for (const box of [LAYOUT.photo, LAYOUT.name.cover, LAYOUT.desig.cover]){
    const r = rectOf(box);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }
  ctx.strokeStyle = '#00cc44';
  for (const spec of [LAYOUT.name, LAYOUT.desig]){
    ctx.beginPath();
    ctx.moveTo((spec.cx - spec.maxW / 2) * S, spec.cy * S);
    ctx.lineTo((spec.cx + spec.maxW / 2) * S, spec.cy * S);
    ctx.stroke();
  }
  ctx.restore();
}

function render(){
  if (!template) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

  if (userPhoto) drawPhoto();

  coverText(LAYOUT.name);
  coverText(LAYOUT.desig);
  drawText(els.name.value.trim().toUpperCase(), LAYOUT.name);
  drawText(els.desig.value.trim().toUpperCase(), LAYOUT.desig);

  if (guides) drawGuides();

  els.download.disabled = !els.name.value.trim();
}

/* --------------------------- interaction --------------------------- */

function canvasPoint(e){
  const b = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - b.left) * (canvas.width  / b.width),
    y: (e.clientY - b.top)  * (canvas.height / b.height)
  };
}

let dragFrom = null;

canvas.addEventListener('pointerdown', e => {
  if (!userPhoto) return;
  const p = canvasPoint(e), r = rectOf(LAYOUT.photo);
  if (p.x < r.x || p.x > r.x + r.w || p.y < r.y || p.y > r.y + r.h) return;
  dragFrom = {p, ox: view.ox, oy: view.oy};
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  if (!dragFrom) return;
  const p = canvasPoint(e), r = rectOf(LAYOUT.photo);
  view.ox = dragFrom.ox + (p.x - dragFrom.p.x) / r.w;
  view.oy = dragFrom.oy + (p.y - dragFrom.p.y) / r.h;
  render();
});

for (const ev of ['pointerup','pointercancel']){
  canvas.addEventListener(ev, () => { dragFrom = null; canvas.classList.remove('dragging'); });
}

els.name.addEventListener('input', render);
els.desig.addEventListener('input', render);

els.zoom.addEventListener('input', () => {
  view.scale = els.zoom.value / 100;
  render();
});

els.photo.addEventListener('change', async () => {
  const file = els.photo.files[0];
  if (!file) return;
  // Read as a data URL - a blob: URL taints the canvas on a file:// page.
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  userPhoto = await loadImage(dataUrl);
  canvas.classList.add('has-photo');
  els.photoName.textContent = file.name.length > 26 ? file.name.slice(0, 24) + '...' : file.name;
  view.scale = 1; view.ox = 0; view.oy = 0;
  els.zoom.value = 100;
  render();
});

/* ----------------------------- output ------------------------------ */

function fileName(){
  const slug = els.name.value.trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'poster';
  return 'laity-conclave-26-' + slug + '.png';
}

function exportFailed(){
  showNotice('The browser blocked the download because the artwork was not embedded. Run ' +
    '<code>./make-template.sh</code> in this folder and reload, or open the page through ' +
    'a web server instead of a <code>file://</code> path.');
}

function setStatus(text, kind){
  els.status.hidden = !text;
  els.status.textContent = text;
  els.status.className = 'status' + (kind ? ' ' + kind : '');
}

let lastUpload = '';

async function uploadPoster(dataUrl){
  if (!UPLOAD_URL) return;
  if (location.protocol === 'file:'){
    setStatus('Shared copies need the page served over http, not a file:// path.', 'err');
    return;
  }
  const key = els.name.value.trim() + '|' + els.desig.value.trim() + '|' + dataUrl.length;
  if (key === lastUpload) return;
  lastUpload = key;

  setStatus('Saving a copy...');
  try {
    // text/plain keeps this a simple request, so the browser skips the CORS
    // preflight that Apps Script does not answer.
    const res = await fetch(UPLOAD_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        name: els.name.value.trim(),
        designation: els.desig.value.trim(),
        image: dataUrl
      })
    });
    const text = await res.text();
    let out;
    try {
      out = JSON.parse(text);
    } catch(e){
      // Apps Script answers with an HTML sign-in page when the deployment is
      // not shared with "Anyone", so a non-JSON reply points straight at that.
      throw new Error(res.status === 403 || /sign in|accounts\.google\.com/i.test(text)
        ? 'the web app is not shared with "Anyone" (HTTP ' + res.status + ')'
        : 'unexpected reply from the web app (HTTP ' + res.status + ')');
    }
    if (!out.ok) throw new Error(out.error || 'upload rejected');
    setStatus('Saved to the shared folder.', 'ok');
  } catch(err){
    lastUpload = '';
    console.error('[poster upload]', err);
    setStatus('Poster downloaded, but the shared copy failed: ' + err.message, 'err');
  }
}

els.download.addEventListener('click', () => {
  let href;
  try { href = canvas.toDataURL('image/png'); }
  catch(e){ exportFailed(); return; }
  const a = document.createElement('a');
  a.download = fileName();
  a.href = href;
  a.click();
  uploadPoster(href);
});

els.share.addEventListener('click', () => {
  try { canvas.toDataURL('image/png'); }
  catch(e){ exportFailed(); return; }
  canvas.toBlob(async blob => {
    const file = new File([blob], fileName(), {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:'KRLCC Laity Conclave 26'}); } catch(e){}
    }
    uploadPoster(canvas.toDataURL('image/png'));
  }, 'image/png');
});

/* ------------------------------ start ------------------------------ */

(async function init(){
  template = await loadTemplate();
  if (!template){
    showNotice('The poster artwork is missing. Save the Laity Conclave 26 design in this ' +
      'folder as <code>template.png</code>, run <code>./make-template.sh</code>, then reload.');
    return;
  }

  canvas.width  = template.naturalWidth;
  canvas.height = template.naturalHeight;
  S = canvas.width / BASE.w;

  try {
    await Promise.all([
      document.fonts.load('800 47px Montserrat'),
      document.fonts.load('800 47px "Noto Sans Malayalam"')
    ]);
  } catch(e){ /* fall back to the system font */ }

  if (navigator.canShare && navigator.canShare({files:[new File([''], 'x.png', {type:'image/png'})]})){
    els.share.hidden = false;
  }
  render();
})();
</script>
</body>
</html>
